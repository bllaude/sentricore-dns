services:
  sentricore-dns-proxy:
    build: .
    container_name: sentricore-dns-proxy
    command: ["python", "-m", "app.dns.proxy"]
    ports:
      - "5300:5300/udp"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./blocklists:/app/blocklists
      - ./config.json:/app/config.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(socket.AF_INET, socket.SOCK_DGRAM); s.settimeout(2); s.sendto(b'\\x00\\x00\\x01\\x00\\x00\\x01\\x00\\x00\\x00\\x00\\x00\\x00\\x07example\\x03com\\x00\\x00\\x01\\x00\\x01', ('127.0.0.1', 5300))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - sentricore-network

  sentricore-dns-web:
    build: .
    container_name: sentricore-dns-web
    command: ["gunicorn", "--bind", "0.0.0.0:5000", "--workers", "2", "app.web.app:app"]
    ports:
      - "5000:5000/tcp"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    depends_on:
      - sentricore-dns-proxy
    networks:
      - sentricore-network

networks:
  sentricore-network:
    driver: bridge